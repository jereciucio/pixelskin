<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelskin - Comparte Skins de Minecraft!</title>
    <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<link rel="shortcut icon" href="images/favicon.ico" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <h3>Login</h3>
        </nav>
    </header>
    <div id="title-container">
        <!-- Aca va el TITULO-->
        <img id="title-image" src="./images/logo_full.png" alt="Título de pixelskin">
    </div>
    <nav>
        <!--ACA VA EL BUSCADOR-->
        <search>
            <label>
                <input type="search" id="query" />
            </label>
            <section>
                <ul id="results">
                    <!-- search result content-->
                </ul>
                <output id="no-result">
                    <!-- no results content -->
                </output>
            </section>
            <button type="submit">Search</button>
        </search>
    </nav>
    <main>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </main>

    <footer>
        <h2>Información de Contacto</h2>
        <!--Logo de github de cada -->
        <a href="https://github.com/jereciucio/pixelskin"><img id="github" src="images/logogithub.png" alt="Logo de Github"></a>
        <!-- Aca va información de contacto,etc-->
        <div id="información">
            <a href="https://github.com/jereciucio" />
            <h3>Jeremias Agustin Ciucio</h3></a>
            <a href="https://github.com/sepulvedalucas">
                <h3>Lucas Sepulveda</h3>
            </a>
            <a href="https://github.com/jorgeugarte-alt">
                <h3>Ugarte Cuevas Jorge Luis</h3>
            </a>
        </div>
    </footer>
</body>

</html>
