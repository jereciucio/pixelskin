<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelskin</title>
  <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="/style.css">

  <!-- Agregar fuente con iconos -->
  <script src="https://kit.fontawesome.com/8013ee8fa0.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="header-container"></div>

  <main>
    <section>
      <div class="contenido-superior">
        <div class="informacion">
          <img id="skin-img-front" class="skinrender" src="" alt="">
          <img id="skin-img-back" class="skinrender" src="" alt="">

        </div>
      </div>

      <div class="skin-meta">
        <h2 id="skin-nombre"></h2>
        <p class="upload-date">Subido: <span id="skin-fecha"></span></p>
        <p class="description" id="skin-descripcion"></p>
      </div>

      <div class="etiquetas">
        <h3>Etiquetas:</h3>
        <ul id="skin-etiquetas"></ul>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>


  <!-- Cargar los componentes de forma dinámica -->
  <script src="/components/footer.js"></script>
  <script src="/components/header.js"></script>
  <script src="/components/posts.js"></script>


  <script src="/components/skinDetails.js"></script>
</body>

</html>
